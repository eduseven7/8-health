<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="8 Health">
<meta name="description" content="Acompanhamento de treino para hipertrofia. Offline, sem nuvem, sem conta.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/icon-1080.png">
<title>8 Health</title>
<style>
:root{
  --brand:#FC5252;
  --brand-soft:rgba(252,82,82,.13);
  --bg:#0A0C0F;
  --surface:#13161C;
  --surface-2:#1A1E26;
  --border:#242A34;
  --border-soft:#1E232B;
  --text:#F3F5F8;
  --muted:#8A93A1;
  --faint:#5C6472;
  --ok:#3FB950;
  --warn:#D29922;
  --r:14px;
  --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 13px;font-size:16px;outline:none;
}
textarea{resize:vertical;min-height:88px;font-family:inherit;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#0D1014}
input::placeholder,textarea::placeholder{color:var(--faint)}
select{appearance:none;-webkit-appearance:none;padding-right:34px}
label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

#brandbar{
  position:sticky;top:0;z-index:40;
  padding:calc(var(--safe-t) + 12px) 18px 12px;
  display:flex;align-items:center;gap:10px;background:var(--bg);
}
#brandbar img{width:26px;height:26px;border-radius:7px;display:block}
#brandbar .wordmark{font-size:.8rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
#brandbar .today{margin-left:auto;font-size:.76rem;color:var(--faint)}
#updbar{position:sticky;top:0;z-index:39;display:flex;align-items:center;gap:10px;
  margin:0 18px 10px;padding:11px 14px;border-radius:var(--r-sm);
  background:var(--brand-soft);border:1px solid rgba(252,82,82,.3);
  font-size:.84rem;font-weight:600;max-width:604px}
#updbar[hidden]{display:none}
#updbar button{background:var(--brand);color:#fff;font-size:.8rem;font-weight:700;
  padding:8px 14px;border-radius:8px;flex:none}
main{padding:4px 18px calc(var(--nav-h) + var(--safe-b) + 30px);max-width:640px;margin:0 auto}

h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.88rem;margin:2px 0 18px}
h3{font-size:1.02rem;font-weight:650;letter-spacing:-.01em}
.section-label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:26px 0 10px}

.card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.tap{display:block;width:100%;text-align:left;transition:border-color .15s,transform .08s}
.card.tap:active{transform:scale(.985);border-color:var(--border)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{margin-top:12px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;
  border-radius:var(--r-sm);font-size:.96rem;font-weight:650;transition:filter .15s,transform .08s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:active{filter:brightness(.9)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:transparent;color:var(--brand);border:1px solid rgba(252,82,82,.35)}
.btn-sm{width:auto;padding:9px 14px;font-size:.85rem;border-radius:9px}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;color:var(--muted);flex:none}
.icon-btn:active{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:.7rem;
  font-weight:700;letter-spacing:.03em;background:var(--surface-2);color:var(--muted);flex:none}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.ok{background:rgba(63,185,80,.13);color:var(--ok)}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty p{font-size:.9rem;margin-bottom:18px}

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;padding-bottom:var(--safe-b);
  background:rgba(13,16,21,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--border-soft)}
#tabbar button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;color:var(--faint);font-size:.64rem;font-weight:700;letter-spacing:.03em}
#tabbar button.active{color:var(--brand)}

.hero{background:linear-gradient(150deg,rgba(252,82,82,.16),rgba(252,82,82,.03) 60%),var(--surface);
  border:1px solid rgba(252,82,82,.22);border-radius:var(--r);padding:18px;margin-bottom:14px}
.hero.tap{display:block;width:100%;text-align:left}
.hero.tap:active{transform:scale(.985)}
.timer{font-variant-numeric:tabular-nums;font-size:2rem;font-weight:700;letter-spacing:-.03em}
.progress{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:14px}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}

.ex-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--r);
  margin-bottom:12px;overflow:hidden}
.ex-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px}
.ex-head .n{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:7px;
  background:var(--surface-2);color:var(--muted);font-size:.7rem;font-weight:700;margin-top:1px}
.ex-head.done .n{background:var(--brand-soft);color:var(--brand)}
.ex-meta{font-size:.76rem;color:var(--faint)}
.nota{font-size:.76rem;color:var(--warn);margin-top:3px}

.serie{display:flex;align-items:center;gap:7px;padding:9px 16px;border-top:1px solid var(--border-soft)}
.serie .idx{width:16px;flex:none;font-size:.76rem;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.serie input{padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.serie.ok{background:rgba(63,185,80,.05)}
.serie.ok input{border-color:rgba(63,185,80,.25);color:var(--muted)}
.check{width:38px;height:38px;flex:none;border-radius:9px;border:1px solid var(--border);
  display:grid;place-items:center;color:var(--faint)}
.check.on{background:var(--ok);border-color:var(--ok);color:#0A0C0F}
.esf{width:52px;height:38px;flex:none;border-radius:9px;border:1px solid var(--border);
  font-size:.6rem;font-weight:700;letter-spacing:.02em;color:var(--faint);text-transform:uppercase}
.esf.e1{border-color:rgba(63,185,80,.4);color:var(--ok);background:rgba(63,185,80,.08)}
.esf.e2{border-color:rgba(210,153,34,.45);color:var(--warn);background:rgba(210,153,34,.08)}
.esf.e3{border-color:rgba(252,82,82,.45);color:var(--brand);background:var(--brand-soft)}
.ex-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border-soft)}
.ex-foot button{font-size:.79rem;font-weight:650;color:var(--muted);padding:4px 0}
.ex-foot button:active{color:var(--text)}

#restbar{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:45;
  background:var(--brand);color:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;
  gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.45);max-width:616px;margin:0 auto}
#restbar[hidden]{display:none}
#restbar .t{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700;letter-spacing:-.02em}
#restbar .l{font-size:.76rem;font-weight:600;opacity:.85;flex:1}
#restbar button{color:#fff;font-size:.78rem;font-weight:700;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.2)}

.item{display:flex;align-items:flex-start;gap:10px;padding:14px 0;border-bottom:1px solid var(--border-soft)}
.item:last-child{border-bottom:none}
.handle{display:flex;flex-direction:column;gap:2px;flex:none;margin-top:2px}
.handle button{width:26px;height:20px;display:grid;place-items:center;color:var(--faint);border-radius:5px}
.handle button:active{background:var(--surface-2);color:var(--text)}
.mini-grid{display:grid;grid-template-columns:.8fr 1.3fr 1fr 1fr;gap:8px;margin-top:10px}
.mini-grid label{font-size:.62rem;margin-bottom:4px;letter-spacing:.04em}
.mini-grid input{padding:9px 4px;text-align:center;font-weight:600}
.faixa{display:flex;align-items:center;gap:4px}
.faixa span{color:var(--faint);font-size:.8rem;flex:none}

#modal{position:fixed;inset:0;z-index:80;display:none}
#modal.on{display:block}
#modal .bd{position:absolute;inset:0;background:rgba(5,7,10,.7)}
#modal .sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;
  background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);max-width:640px;margin:0 auto;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
#modal .sheet-h{padding:16px 18px 12px;border-bottom:1px solid var(--border-soft)}
#modal .sheet-b{overflow-y:auto;padding:14px 18px 20px;-webkit-overflow-scrolling:touch}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--border-soft)}
.pick:active{background:var(--surface-2)}
.grp-tag{font-size:.68rem;font-weight:700;color:var(--faint);letter-spacing:.05em;text-transform:uppercase;flex:none}

.chart{width:100%;height:150px;display:block}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{fill:var(--brand)}
.chart .base{stroke:var(--border);stroke-width:1}
.stat{flex:1;background:var(--surface-2);border-radius:var(--r-sm);padding:12px;min-width:0}
.stat b{display:block;font-size:1.3rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700}

.wk{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.wk .lbl{flex:1;text-align:center;font-size:.8rem;color:var(--muted);font-weight:650}
.vol{display:flex;align-items:center;gap:10px;padding:7px 0}
.vol .g{width:58px;flex:none;font-size:.76rem;font-weight:650}
.vol .b{flex:1;height:20px;background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden}
.vol .zone{position:absolute;top:0;bottom:0;background:rgba(63,185,80,.13)}
.vol .fill{position:absolute;top:6px;height:8px;left:0;background:var(--brand);border-radius:99px;min-width:3px}
.vol .n{width:22px;flex:none;text-align:right;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.legend{font-size:.7rem;color:var(--faint);margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);z-index:90;
  transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:11px 18px;border-radius:99px;font-size:.85rem;font-weight:600;max-width:88vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.5)}
</style>
</head>
<body>

<header id="brandbar">
  <img src="assets/favicon.png" alt="">
  <span class="wordmark">8 Health</span>
  <span class="today" id="todayLabel"></span>
</header>

<div id="updbar" hidden></div>

<main id="app"></main>

<div id="restbar" hidden></div>

<nav id="tabbar"></nav>

<div id="modal">
  <div class="bd" data-a="modal-close"></div>
  <div class="sheet"><div class="sheet-h" id="modalH"></div><div class="sheet-b" id="modalB"></div></div>
</div>

<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
"use strict";

/* ============================================================
   8 HEALTH — acompanhamento de treino para hipertrofia
   Dados 100% locais (IndexedDB). Nenhuma requisicao externa.
   Vocabulario e regras de dominio: ver CONTEXT.md
   ============================================================ */

const APP_VERSION = "1.1.0";

const GRUPOS = ["Peito","Costas","Ombro","Bíceps","Tríceps","Pernas","Core","Cardio"];

/* JS getDay(): 0=domingo .. 6=sabado. A semana do app vai de segunda a domingo. */
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DIAS_ORDEM = [1,2,3,4,5,6,0];
const ESFORCOS = ["", "fácil", "limite", "falhei"];

const SEED_EX = [
  ["Supino Reto (Barra)","Peito"],["Supino Inclinado (Halter)","Peito"],["Supino Declinado","Peito"],
  ["Crucifixo (Máquina)","Peito"],["Crossover","Peito"],["Flexão de Braço","Peito"],
  ["Puxada Frontal","Costas"],["Remada Curvada","Costas"],["Remada Baixa","Costas"],
  ["Barra Fixa","Costas"],["Remada Unilateral","Costas"],["Pulldown","Costas"],
  ["Desenvolvimento (Halter)","Ombro"],["Elevação Lateral","Ombro"],["Elevação Frontal","Ombro"],
  ["Crucifixo Inverso","Ombro"],["Encolhimento","Ombro"],
  ["Rosca Direta","Bíceps"],["Rosca Alternada","Bíceps"],["Rosca Martelo","Bíceps"],
  ["Rosca Scott","Bíceps"],["Rosca Concentrada","Bíceps"],
  ["Tríceps Corda","Tríceps"],["Tríceps Testa","Tríceps"],["Tríceps Francês","Tríceps"],
  ["Tríceps Pulley (Barra)","Tríceps"],["Mergulho no Banco","Tríceps"],
  ["Agachamento Livre","Pernas"],["Leg Press","Pernas"],["Cadeira Extensora","Pernas"],
  ["Mesa Flexora","Pernas"],["Stiff","Pernas"],["Afundo","Pernas"],
  ["Agachamento Búlgaro","Pernas"],["Panturrilha em Pé","Pernas"],["Cadeira Adutora","Pernas"],
  ["Cadeira Abdutora","Pernas"],["Levantamento Terra","Pernas"],
  ["Prancha","Core"],["Abdominal Supra","Core"],["Elevação de Pernas","Core"],["Abdominal Infra","Core"],
  ["Esteira","Cardio"],["Bicicleta","Cardio"],["Elíptico","Cardio"],["Escada","Cardio"]
];

const ICONS = {
  hoje:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
  planos:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  prog:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3.5-4.5 3 3L20 7"/></svg>',
  dados:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>',
  check:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  up:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6 7l1 13h10l1-13"/></svg>',
  chevron:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  arrowUp:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>',
  prev:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>'
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const pad2 = n => String(n).padStart(2, "0");
const nKg = v => (Math.round(v * 10) / 10).toString().replace(".", ",");

function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return (h ? h + ":" + pad2(m) : String(m)) + ":" + pad2(s % 60);
}
const fmtData = iso => { const d = new Date(iso); return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1) + "/" + d.getFullYear(); };
const fmtDataCurta = iso => { const d = new Date(iso); return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1); };

/* semana de segunda a domingo; offset 0 = semana atual */
function inicioSemana(offset){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + (offset || 0) * 7);
  return d;
}

let toastTimer = null;
function toast(msg){
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2800);
}

/* "8-10" -> {repMin:8, repMax:10}; "10" -> {10,10}; resto -> nulos */
function parseFaixa(txt){
  const s = String(txt == null ? "" : txt).trim();
  let m = s.match(/^(\d+)\s*(?:-|–|a|até)\s*(\d+)$/i);
  if (m) return { repMin:+m[1], repMax:+m[2] };
  m = s.match(/^(\d+)$/);
  if (m) return { repMin:+m[1], repMax:+m[1] };
  return { repMin:null, repMax:null };
}
function textoFaixa(repMin, repMax){
  if (!repMin && !repMax) return "";
  if (repMin && repMax && repMin !== repMax) return repMin + "-" + repMax;
  return String(repMin || repMax);
}

/* ---------- IndexedDB ---------- */
const DB_NAME = "OitoHealthDB", DB_VER = 2;
const STORES_LISTA = ["exercicios", "fichas", "sessoes", "medidas"];
const STORES_CHAVE = ["perfil", "dieta"];
const STORES = STORES_LISTA.concat(STORES_CHAVE);
let db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const d = e.target.result, tx = e.target.transaction, antiga = e.oldVersion;
      STORES_LISTA.forEach(s => {
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:"id", autoIncrement:true });
      });
      STORES_CHAVE.forEach(s => {
        if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:"k" });
      });
      if (antiga >= 1 && antiga < 2) migrarV1paraV2(tx);
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}

/* v1 guardava a faixa de reps como texto livre e nao tinha dia da semana nem esforco */
function migrarV1paraV2(tx){
  tx.objectStore("fichas").openCursor().onsuccess = ev => {
    const c = ev.target.result;
    if (!c) return;
    const f = c.value;
    if (f.diaSemana === undefined) f.diaSemana = null;
    f.itens = (f.itens || []).map(it => {
      if (it.repMin !== undefined) return it;
      const fx = parseFaixa(it.reps);
      return { exId:it.exId, series:it.series, repMin:fx.repMin, repMax:fx.repMax,
               carga:it.carga, descanso:it.descanso, nota:"" };
    });
    c.update(f);
    c.continue();
  };
  tx.objectStore("sessoes").openCursor().onsuccess = ev => {
    const c = ev.target.result;
    if (!c) return;
    const s = c.value;
    if (s.observacao === undefined) s.observacao = "";
    (s.exercicios || []).forEach(e => {
      if (e.alvo && e.repMin === undefined){
        const fx = parseFaixa(String(e.alvo).split("×")[1] || "");
        e.repMin = fx.repMin; e.repMax = fx.repMax;
      }
      (e.series || []).forEach(x => { if (x.esforco === undefined) x.esforco = ""; });
    });
    c.update(s);
    c.continue();
  };
}

const pr = req => new Promise((res, rej) => { req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error); });

const dbAdd = (s, v) => pr(db.transaction(s, "readwrite").objectStore(s).add(v));
const dbDel = (s, k) => pr(db.transaction(s, "readwrite").objectStore(s).delete(k));
const dbClear = s => pr(db.transaction(s, "readwrite").objectStore(s).clear());

/* ---------- estado em memória ---------- */
let EXS = [], FICHAS = [], SESSOES = [];

async function loadAll(){
  const [a, b, c] = await Promise.all([dbAll("exercicios"), dbAll("fichas"), dbAll("sessoes")]);
  EXS = a.sort((x, y) => x.nome.localeCompare(y.nome, "pt-BR"));
  FICHAS = b.sort((x, y) => (x.ordem || 0) - (y.ordem || 0));
  SESSOES = c.sort((x, y) => new Date(y.inicio) - new Date(x.inicio));
}
const exById = id => EXS.find(e => e.id === id);
const sessaoAtiva = () => SESSOES.find(s => s.status === "ativa");
const concluidas = () => SESSOES.filter(s => s.status === "concluida");
const fichaDoDia = () => FICHAS.find(f => f.diaSemana === new Date().getDay());

/* ---------- métricas ---------- */
function seriesFeitas(sess){
  let n = 0;
  sess.exercicios.forEach(e => e.series.forEach(s => { if (s.feita) n++; }));
  return n;
}
const seriesTotal = sess => sess.exercicios.reduce((a, e) => a + e.series.length, 0);

function cargaTotal(sess){
  let v = 0;
  sess.exercicios.forEach(e => e.series.forEach(s => { if (s.feita) v += num(s.reps) * num(s.carga); }));
  return v;
}
function ultimaExecucao(exId){
  for (const s of concluidas()){
    const e = s.exercicios.find(x => x.exId === exId && x.series.some(y => y.feita));
    if (e) return { data:s.inicio, series:e.series.filter(y => y.feita) };
  }
  return null;
}
function recorde(exId){
  let melhor = null;
  concluidas().forEach(s => {
    const e = s.exercicios.find(x => x.exId === exId);
    if (!e) return;
    e.series.forEach(x => {
      if (!x.feita) return;
      const c = num(x.carga);
      if (c > 0 && (!melhor || c > melhor.carga)) melhor = { carga:c, reps:x.reps, data:s.inicio };
    });
  });
  return melhor;
}

/* Hora de subir: na ultima execucao, todas as series bateram o topo da faixa
   e a ultima delas nao foi marcada como "falhei". Ver CONTEXT.md. */
function horaDeSubir(exId, repMax){
  if (!repMax) return null;
  const ult = ultimaExecucao(exId);
  if (!ult || !ult.series.length) return null;
  if (!ult.series.every(s => num(s.reps) >= repMax)) return null;
  if (ult.series[ult.series.length - 1].esforco === "falhei") return null;
  const carga = Math.max.apply(null, ult.series.map(s => num(s.carga)));
  if (!carga) return null;
  return carga + 2.5;
}

/* Volume: series concluidas por grupo muscular na semana, contando so o grupo
   principal do exercicio. Ver CONTEXT.md. */
function volumeSemana(offset){
  const ini = inicioSemana(offset), fim = new Date(ini);
  fim.setDate(fim.getDate() + 7);
  const conta = {};
  concluidas().forEach(s => {
    const d = new Date(s.inicio);
    if (d < ini || d >= fim) return;
    s.exercicios.forEach(e => {
      const g = e.grupo || (exById(e.exId) || {}).grupo;
      if (!g) return;
      const n = e.series.filter(x => x.feita).length;
      if (n) conta[g] = (conta[g] || 0) + n;
    });
  });
  return { ini, fim, conta };
}

function startTick(){

    if (s && el) el.textContent = fmtClock(Date.now() - new Date(s.inicio).getTime());

/* ---------- timer de descanso ---------- */
let rest = { end:0, iv:null, label:"" };
function startRest(seg, label){
  if (!seg) return;
  stopRest();
  rest.end = Date.now() + seg * 1000;
  rest.label = label || "Descanso";
  rest.iv = setInterval(drawRest, 250);
  drawRest();
}
function stopRest(){
  if (rest.iv) clearInterval(rest.iv);
  rest.iv = null;
  const bar = $("restbar");
  bar.hidden = true;
  bar.innerHTML = "";
}
function drawRest(){
  const left = rest.end - Date.now(), bar = $("restbar");
  if (left <= 0){ beep(); stopRest(); return; }
  bar.hidden = false;
  bar.innerHTML = '<span class="t">' + fmtClock(left) + '</span>' +
    '<span class="l">' + esc(rest.label) + '</span>' +
    '<button data-a="rest-add">+30s</button><button data-a="rest-skip">Pular</button>';
}
function beep(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = 880;
    g.gain.setValueAtTime(.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .45);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + .5);
    setTimeout(() => ctx.close(), 800);
  }catch(_){}
  if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
}

      c += '<div style="margin-top:12px;border-top:1px solid var(--border-soft);padding-top:10px">' +
        (s.observacao ? '<div class="nota" style="margin-bottom:8px">' + esc(s.observacao) + '</div>' : "") +
        s.exercicios.map(e => {
          const f = e.series.filter(x => x.feita);
          if (!f.length) return "";
          return '<div style="padding:6px 0"><div style="font-weight:600;font-size:.92rem">' + esc(e.nome) + '</div>' +
            '<div class="ex-meta">' + f.map(x => nKg(num(x.carga)) + "kg × " + esc(x.reps) +
              (x.esforco ? " (" + esc(x.esforco) + ")" : "")).join("  ·  ") + '</div></div>';
        }).join("") +
        '<div class="ex-meta" style="margin-top:8px">Carga total: ' + nKg(cargaTotal(s)) + ' kg</div>' +
        '<button class="btn btn-danger mt" data-a="sess-del:' + s.id + '">Excluir este treino</button></div>';
    }
    return c + '</div>';
  }).join("");

  return h;
}

function painelVolume(){
  const { ini, conta } = volumeSemana(state.semana);
  const fimLbl = new Date(ini); fimLbl.setDate(fimLbl.getDate() + 6);
  const grupos = GRUPOS.filter(g => conta[g]);
  const maxN = grupos.reduce((a, g) => Math.max(a, conta[g]), 0);
  const escala = Math.max(20, maxN);

  let h = '<div class="card"><div class="wk">' +
    '<button class="icon-btn" data-a="wk:-1">' + ICONS.prev + '</button>' +
    '<span class="lbl">' + (state.semana === 0 ? "Esta semana" : "") + ' ' +
    fmtDataCurta(ini) + ' – ' + fmtDataCurta(fimLbl) + '</span>' +
    '<button class="icon-btn" data-a="wk:1"' + (state.semana >= 0 ? ' style="opacity:.25"' : "") + '>' + ICONS.next + '</button>' +
    '</div>';

  if (!grupos.length){
    h += '<div class="ex-meta" style="text-align:center;padding:18px 0">Nenhuma série registrada nesta semana.</div></div>';
    return h;
  }

  h += grupos.map(g => {
    const n = conta[g];
    const zl = 10 / escala * 100, zw = 10 / escala * 100;
    return '<div class="vol"><span class="g trunc">' + esc(g) + '</span>' +
      '<span class="b"><i class="zone" style="left:' + zl.toFixed(1) + '%;width:' + zw.toFixed(1) + '%"></i>' +
      '<i class="fill" style="width:' + (n / escala * 100).toFixed(1) + '%"></i></span>' +
      '<span class="n">' + n + '</span></div>';
  }).join("");

  h += '<div class="legend">Séries por grupo muscular. A faixa verde marca a referência de 10 a 20 séries semanais.</div></div>';
  return h;
}

function chartCarga(exId){
  const pts = [];
  concluidas().slice().reverse().forEach(s => {
    const e = s.exercicios.find(x => x.exId === exId);
    if (!e) return;
    const f = e.series.filter(x => x.feita && num(x.carga) > 0);
    if (!f.length) return;
    pts.push({ y:Math.max.apply(null, f.map(x => num(x.carga))), data:s.inicio });
  });

  const rec = recorde(exId);
  const infoRec = rec
    ? '<div class="row mt" style="gap:10px">' +
      '<div class="stat"><b>' + nKg(rec.carga) + ' kg</b><span>Recorde · ' + fmtDataCurta(rec.data) + '</span></div>' +
      (pts.length > 1
        ? '<div class="stat"><b>' + (pts[pts.length - 1].y - pts[0].y > 0 ? "+" : "") +
          nKg(pts[pts.length - 1].y - pts[0].y) + ' kg</b><span>Desde ' + fmtDataCurta(pts[0].data) + '</span></div>'
        : "") + '</div>'
    : "";

  if (pts.length < 2){
    return '<div class="ex-meta" style="text-align:center;padding:22px 0">' +
      (pts.length ? "Registre este exercício em pelo menos 2 treinos para ver a evolução." : "Sem dados.") +
      '</div>' + infoRec;
  }

  const W = 300, H = 120, P = 8;
  const ys = pts.map(p => p.y);
  const min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
  const span = (max - min) || 1;
  const px = i => P + i * (W - P * 2) / (pts.length - 1);
  const py = v => H - P - (v - min) / span * (H - P * 2);
  const path = pts.map((p, i) => (i ? "L" : "M") + px(i).toFixed(1) + " " + py(p.y).toFixed(1)).join(" ");
  const dots = pts.map((p, i) => '<circle class="dot" cx="' + px(i).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="3"/>').join("");

  return '<svg class="chart mt" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<line class="base" x1="0" y1="' + (H - 1) + '" x2="' + W + '" y2="' + (H - 1) + '"/>' +
    '<path class="ln" d="' + path + '"/>' + dots + '</svg>' + infoRec;
}

async function iniciarSessao(fichaId){
  if (sessaoAtiva()){ toast("Já existe um treino em andamento"); return; }
  const f = FICHAS.find(x => x.id === fichaId);
  if (!f) return;

  const sess = {
    fichaId: f.id,
    nome: f.nome,
    inicio: new Date().toISOString(),
    fim: null,
    status: "ativa",
    observacao: "",
    exercicios: f.itens.map(it => {
      const ex = exById(it.exId);
      const ult = ultimaExecucao(it.exId);
      return {
        exId: it.exId,
        nome: ex ? ex.nome : "(removido)",
        grupo: ex ? ex.grupo : null,
        descanso: it.descanso || 0,
        nota: it.nota || "",
        repMin: it.repMin == null ? null : it.repMin,
        repMax: it.repMax == null ? null : it.repMax,
        series: Array.from({ length: Math.max(1, it.series) }, (_, k) => ({
          reps: ult && ult.series[k] ? ult.series[k].reps : "",
          carga: (ult && ult.series[k] ? ult.series[k].carga : it.carga) || "",
          feita: false,
          esforco: ""
        }))
      };
    })
  };
  await dbAdd("sessoes", sess);
  await loadAll();
  state.view = "hoje";
  render();
}

let saveTimer = null;
function salvarSessao(sess, redraw){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { dbPut("sessoes", sess); }, 350);
  if (redraw) render();
}

async function finalizarSessao(){
  const s = sessaoAtiva();
  if (!s) return;

  /* recordes anteriores, para avisar se algum caiu hoje */
  const antes = {};
  s.exercicios.forEach(e => { const r = recorde(e.exId); antes[e.exId] = r ? r.carga : 0; });

  clearTimeout(saveTimer);
  const obs = $("obs");
  s.observacao = obs ? obs.value.trim() : (s.observacao || "");
  s.status = "concluida";
  s.fim = new Date().toISOString();
  s.exercicios.forEach(e => { e.series = e.series.filter(x => x.feita || num(x.carga) || String(x.reps).trim()); });

  const novos = [];
  s.exercicios.forEach(e => {
    const feitas = e.series.filter(x => x.feita && num(x.carga) > 0);
    if (!feitas.length) return;
    const maxHoje = Math.max.apply(null, feitas.map(x => num(x.carga)));
    if (maxHoje > (antes[e.exId] || 0)) novos.push(e.nome + " " + nKg(maxHoje) + "kg");
  });

  await dbPut("sessoes", s);
  stopRest();
  closeModal();
  await loadAll();
  render();
  toast(novos.length ? "Novo recorde: " + novos[0] : "Treino concluído · " + seriesFeitas(s) + " séries");
}

async function descartarSessao(){
  const s = sessaoAtiva();
  if (!s) return;
  if (!confirm("Descartar esta sessão? Nada será salvo.")) return;
  clearTimeout(saveTimer);
  await dbDel("sessoes", s.id);
  stopRest();
  await loadAll();
  render();
}

async function exportar(){
  const dados = {
    app: "8health",
    versao: 2,
    exportadoEm: new Date().toISOString(),
    perfil: {},
    exercicios: EXS,
    fichas: FICHAS,
    sessoes: SESSOES,
    medidas: [],
    dieta: {}
  };
  const nome = "8health-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type:"application/json" });

  try{
    const file = new File([blob], nome, { type:"application/json" });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"Backup 8 Health" });
      return;
    }
  }catch(err){
    if (err && err.name === "AbortError") return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* backups v1 nao tinham faixa estruturada, dia da semana nem esforco */
function migrarBackup(dados){
  if ((dados.versao || 1) >= 2) return dados;
  (dados.fichas || []).forEach(f => {
    if (f.diaSemana === undefined) f.diaSemana = null;
    f.itens = (f.itens || []).map(it => {
      if (it.repMin !== undefined) return it;
      const fx = parseFaixa(it.reps);
      return { exId:it.exId, series:it.series, repMin:fx.repMin, repMax:fx.repMax,
               carga:it.carga, descanso:it.descanso, nota:"" };
    });
  });
  (dados.sessoes || []).forEach(s => {
    if (s.observacao === undefined) s.observacao = "";
    (s.exercicios || []).forEach(e => {
      if (e.alvo && e.repMin === undefined){
        const fx = parseFaixa(String(e.alvo).split("×")[1] || "");
        e.repMin = fx.repMin; e.repMax = fx.repMax;
      }
      (e.series || []).forEach(x => { if (x.esforco === undefined) x.esforco = ""; });
    });
  });
  dados.versao = 2;
  return dados;
}

async function importar(file){
  let dados;
  try{ dados = JSON.parse(await file.text()); }
  catch(_){ toast("Arquivo inválido"); return; }

  if (!dados || !Array.isArray(dados.exercicios) || !Array.isArray(dados.fichas)){
    toast("Backup não reconhecido"); return;
  }
  if (!confirm("Restaurar o backup? Os dados atuais deste aparelho serão substituídos.")) return;

  dados = migrarBackup(dados);

  for (const s of STORES) await dbClear(s);
  for (const e of dados.exercicios) await dbAdd("exercicios", e);
  for (const f of dados.fichas) await dbAdd("fichas", f);
  for (const s of (dados.sessoes || [])) await dbAdd("sessoes", s);
  for (const m of (dados.medidas || [])) await dbAdd("medidas", m);

  await loadAll();
  state.view = "hoje";
  render();
  toast("Backup restaurado");
}

async function apagarTudo(){
  if (!confirm("Apagar TODOS os dados deste aparelho? Isso não pode ser desfeito.")) return;
  if (!confirm("Tem certeza absoluta? Exporte um backup antes se quiser guardar.")) return;
  for (const s of STORES) await dbClear(s);
  await seedExercicios();
  await loadAll();
  state.view = "hoje";
  render();
  toast("Dados apagados");
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-a]");
  if (!el) return;
  const [act, a1, a2] = el.dataset.a.split(":");

  if (act === "tab"){ state.view = a1; state.fichaEdit = null; state.draft = null; render(); return; }
  if (act === "modal-close"){ closeModal(); return; }

  /* sessão */
  if (act === "start"){ await iniciarSessao(+a1); return; }
  if (act === "sess-finish"){ modalFinalizar(); return; }
  if (act === "sess-finish-ok"){ await finalizarSessao(); return; }
  if (act === "sess-cancel"){ await descartarSessao(); return; }

  if (act === "serie"){
    const s = sessaoAtiva(); if (!s) return;
    const exc = s.exercicios[+a1], sr = exc.series[+a2];
    sr.feita = !sr.feita;
    if (sr.feita && exc.descanso) startRest(exc.descanso, exc.nome + " · série " + (+a2 + 1));
    salvarSessao(s, true);
    return;
  }
  if (act === "esf"){
    const s = sessaoAtiva(); if (!s) return;
    const sr = s.exercicios[+a1].series[+a2];
    sr.esforco = ESFORCOS[(ESFORCOS.indexOf(sr.esforco || "") + 1) % ESFORCOS.length];
    salvarSessao(s, true);
    return;
  }
  if (act === "serie-add"){
    const s = sessaoAtiva(); if (!s) return;
    const exc = s.exercicios[+a1];
    const last = exc.series[exc.series.length - 1] || { reps:"", carga:"" };
    exc.series.push({ reps:last.reps, carga:last.carga, feita:false, esforco:"" });
    salvarSessao(s, true);
    return;
  }
  if (act === "serie-del"){
    const s = sessaoAtiva(); if (!s) return;
    const exc = s.exercicios[+a1];
    if (exc.series.length > 1) exc.series.pop();
    salvarSessao(s, true);
    return;
  }
  if (act === "rest-add"){ rest.end += 30000; drawRest(); return; }
  if (act === "rest-skip"){ stopRest(); return; }

  /* fichas */
  if (act === "ficha-new"){
    state.view = "planos"; state.fichaEdit = "new"; state.draft = novoDraft(); render(); return;
  }
  if (act === "ficha-edit"){
    const f = FICHAS.find(x => x.id === +a1); if (!f) return;
    state.fichaEdit = f.id;
    state.draft = {
      nome: f.nome,
      diaSemana: f.diaSemana === undefined ? null : f.diaSemana,
      itens: f.itens.map(i => Object.assign({}, i)),
      ordem: f.ordem || 0
    };
    render(); return;
  }
  if (act === "ficha-back"){ state.fichaEdit = null; state.draft = null; render(); return; }
  if (act === "ficha-save"){ await salvarFicha(); return; }
  if (act === "ficha-del"){
    if (!confirm("Excluir esta ficha? O histórico de treinos é mantido.")) return;
    await dbDel("fichas", state.fichaEdit);
    await loadAll();
    state.fichaEdit = null; state.draft = null;
    render(); toast("Ficha excluída"); return;
  }

  if (act === "item-add"){ modalPicker(""); return; }
  if (act === "item-del"){ state.draft.itens.splice(+a1, 1); render(); return; }
  if (act === "item-up" && +a1 > 0){
    const it = state.draft.itens;
    [it[+a1 - 1], it[+a1]] = [it[+a1], it[+a1 - 1]];
    render(); return;
  }
  if (act === "item-down" && +a1 < state.draft.itens.length - 1){
    const it = state.draft.itens;
    [it[+a1 + 1], it[+a1]] = [it[+a1], it[+a1 + 1]];
    render(); return;
  }

  /* exercícios */
  if (act === "ex-lib"){ modalBiblioteca(); return; }
  if (act === "ex-new"){ modalNovoEx(); return; }
  if (act === "ex-create"){
    const nome = ($("nxNome").value || "").trim();
    if (!nome){ toast("Informe o nome"); return; }
    if (EXS.some(e => e.nome.toLowerCase() === nome.toLowerCase())){ toast("Já existe"); return; }
    await dbAdd("exercicios", { nome, grupo:$("nxGrupo").value });
    await loadAll();
    if (state.fichaEdit !== null) modalPicker(nome); else modalBiblioteca();
    return;
  }
  if (act === "ex-pick"){
    state.draft.itens.push({ exId:+a1, series:3, repMin:8, repMax:12, carga:"", descanso:60, nota:"" });
    closeModal(); render(); return;
  }
  if (act === "ex-del"){
    if (FICHAS.some(f => f.itens.some(i => i.exId === +a1))){ toast("Em uso em uma ficha"); return; }
    await dbDel("exercicios", +a1);
    await loadAll(); modalBiblioteca(); return;
  }

  /* progresso */
  if (act === "wk"){
    const novo = state.semana + (+a1);
    if (novo <= 0) { state.semana = novo; render(); }
    return;
  }
  if (act === "sess-open"){ state.sessOpen = state.sessOpen === +a1 ? null : +a1; render(); return; }
  if (act === "sess-del"){
    if (!confirm("Excluir este treino do histórico?")) return;
    await dbDel("sessoes", +a1);
    state.sessOpen = null;
    await loadAll(); render(); toast("Treino excluído"); return;
  }

  /* dados */
  if (act === "export"){ await exportar(); return; }
  if (act === "import"){ $("fileIn").click(); return; }
  if (act === "wipe"){ await apagarTudo(); return; }

  /* app */
  if (act === "app-update"){ aplicarAtualizacao(); return; }
  if (act === "app-check"){ await procurarAtualizacao(); return; }
});

document.addEventListener("input", ev => {
  const el = ev.target.closest("[data-f]");
  if (!el) return;
  const f = el.dataset.f, i = +el.dataset.i, j = +el.dataset.j;

  if (f === "carga" || f === "reps"){
    const s = sessaoAtiva(); if (!s) return;
    s.exercicios[i].series[j][f] = el.value;
    salvarSessao(s, false);
    return;
  }
  if (f === "ficha-nome"){ state.draft.nome = el.value; return; }
  if (f === "it-series"){ state.draft.itens[i].series = Math.max(1, parseInt(el.value, 10) || 1); return; }
  if (f === "it-repmin"){ state.draft.itens[i].repMin = el.value === "" ? null : Math.max(1, parseInt(el.value, 10) || 1); return; }
  if (f === "it-repmax"){ state.draft.itens[i].repMax = el.value === "" ? null : Math.max(1, parseInt(el.value, 10) || 1); return; }
  if (f === "it-carga"){ state.draft.itens[i].carga = el.value; return; }
  if (f === "it-desc"){ state.draft.itens[i].descanso = Math.max(0, parseInt(el.value, 10) || 0); return; }
  if (f === "it-nota"){ state.draft.itens[i].nota = el.value; return; }
  if (f === "ex-search"){ $("modalB").innerHTML = listaPicker(el.value); return; }
});

document.addEventListener("change", ev => {
  const el = ev.target.closest("[data-f]");
  if (!el) return;
  if (el.dataset.f === "prog-ex"){ state.progEx = +el.value; render(); return; }
  if (el.dataset.f === "ficha-dia"){ state.draft.diaSemana = el.value === "" ? null : +el.value; return; }
});

$("fileIn").addEventListener("change", async ev => {
  const file = ev.target.files[0];
  ev.target.value = "";
  if (file) await importar(file);
});

window.addEventListener("beforeunload", ev => {
  if (saindoDeProposito) return;
  if (sessaoAtiva()){ ev.preventDefault(); ev.returnValue = ""; }
});

/* ============================================================
   ATUALIZAÇÃO DO APP
   Atualizar nunca apaga dados: o IndexedDB sobrevive a novas versões.
   Quem apaga é DESINSTALAR o PWA — no iOS, remover da Tela de Início
   leva o armazenamento junto. Por isso o app se atualiza sozinho.
   ============================================================ */
let swReg = null, recarregando = false, atualizacaoPedida = false, saindoDeProposito = false;

function mostrarAtualizacao(){
  const b = $("updbar");
  if (!b.hidden) return;
  b.hidden = false;
  b.innerHTML = '<span class="grow">Nova versão disponível</span>' +
    '<button data-a="app-update">Atualizar</button>';
}

function aplicarAtualizacao(){
  saindoDeProposito = true;
  if (swReg && swReg.waiting){
    atualizacaoPedida = true;
    swReg.waiting.postMessage({ type:"SKIP_WAITING" });
    /* se o controllerchange não vier, recarrega assim mesmo */
    setTimeout(() => { if (!recarregando){ recarregando = true; location.reload(); } }, 1500);
  } else {
    recarregando = true;
    location.reload();
  }
}

async function registrarSW(){
  if (!("serviceWorker" in navigator)) return;
  try{
    swReg = await navigator.serviceWorker.register("sw.js");

    if (swReg.waiting && navigator.serviceWorker.controller) mostrarAtualizacao();

    swReg.addEventListener("updatefound", () => {
      const novo = swReg.installing;
      if (!novo) return;
      novo.addEventListener("statechange", () => {
        /* só avisa se já havia uma versão rodando — na 1ª instalação não há o que atualizar */
        if (novo.state === "installed" && navigator.serviceWorker.controller) mostrarAtualizacao();
      });
    });

    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!atualizacaoPedida || recarregando) return;
      recarregando = true;
      location.reload();
    });

    /* o PWA costuma ser retomado sem recarregar; checa ao voltar para o primeiro plano */
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && swReg) swReg.update().catch(() => {});
    });
  }catch(_){}
}

async function procurarAtualizacao(){
  if (!swReg){ toast("Atualização automática indisponível"); return; }
  try{
    await swReg.update();
    setTimeout(() => {
      if ($("updbar").hidden) toast("Você já está na versão mais recente");
    }, 1200);
  }catch(_){ toast("Sem conexão para verificar"); }
}

/* ============================================================
   BOOT
   ============================================================ */
async function seedExercicios(){
  const atual = await dbAll("exercicios");
  if (atual.length) return;
  for (const [nome, grupo] of SEED_EX) await dbAdd("exercicios", { nome, grupo });
}

(async function boot(){
  const d = new Date();
  $("todayLabel").textContent = pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1);

  try{
    await openDB();
    await seedExercicios();
    await loadAll();
  }catch(err){
    $("app").innerHTML = '<div class="empty"><p>Não foi possível abrir o banco local.<br>' +
      'Verifique se o navegador não está em modo privado.</p></div>';
    console.error(err);
    return;
  }
  render();
  registrarSW();
})();
</script>
